# ==========================================
# APPLICATION
# ==========================================
spring.application.name=ecommerce

# ==========================================
# JACKSON CONFIGURATION
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=5000
server.forward-headers-strategy=framework
server.use-forward-headers=true
rag.port=8000

# ==========================================
# MAIL CONFIGURATION (GMAIL)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# BANKING CONFIGURATION (SEPAY)
# ==========================================
sepay.account-number=${SEPAY_ACCOUNT_NUMBER}
sepay.bank-name=MB

# ==========================================
# WEBHOOK CONFIGURATION
# ==========================================
hooks.api-key=${HOOKS_API_KEY}
hooks.order-id-pattern=ORDER_
hooks.amount-tolerance=0

# ==========================================
# DOMAIN CONFIGURATION
# ==========================================
app.domain=doantrang.online
app.pythonApiUrl=https://rag.doantrang.online
rag.domain=rag.doantrang.online

# ==========================================
# RECAPTCHA CONFIGURATION
# ==========================================
recaptcha.site-key=${RECAPTCHA_SITE_KEY}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify
recaptcha.score-threshold=0.5

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=MyVeryLongSecretKeyForJWTTokenGenerationAndValidation12345
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ==========================================
# REDIS CONFIGURATION
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000
spring.data.redis.database=0

# ==========================================
# GHN (Giao Hang Nhanh) CONFIGURATION
# ==========================================

ghn.base-url=https://dev-online-gateway.ghn.vn
ghn.token=487a9da5-58a4-11f1-a973-aee5264794df
ghn.shop-id=200413


# Service
ghn.service-type-id=2
ghn.payment-type-id=2
ghn.required-note=KHONGCHOXEMHANG

# Package size
ghn.default-weight=1200
ghn.default-length=12
ghn.default-width=12
ghn.default-height=12

# ==========================================
# SHOP ADDRESS (HARDCODE FOR DEV)
# ==========================================

ghn.from-name=Ecommerce Shop
ghn.from-phone=0900000000

ghn.from-address=72 Thanh Thai
ghn.from-ward-name=Phuong 14
ghn.from-district-name=Quan 10
ghn.from-province-name=HCM

# ==========================================
# RETURN ADDRESS
# ==========================================

ghn.return-phone=0900000000
ghn.return-address=72 Thanh Thai
ghn.return-ward-name=Phuong 14
ghn.return-district-name=Quan 10
ghn.return-province-name=HCM

# ==========================================
# ==========================================
genai.api.embed=${GENAI_API_EMBED}
genai.api.decision=${GENAI_API_DECISION}
genai.api.chat=${GENAI_API_CHAT}

# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.example.ecommerce=INFO

# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Static resource for uploaded files
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.mvc.static-path-pattern=/uploads/**

# Base URL for file serving
app.base-url=https://doantrang.online

# ==========================================
# ACTUATOR & SWAGGER
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.tryItOutEnabled=true
